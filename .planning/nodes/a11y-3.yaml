id: A11Y-3
title: 全站列表显式声明 role="list"（方案 A）
type: IMPLEMENTATION
status: DONE
objective: |
  style.css 的全局重置 ul, ol { list-style: none } 命中站内每个列表，而
  WebKit 对去掉项目符号的列表会从 accessibility tree 移除 list/listitem
  语义——Safari + VoiceOver 下全站列表失去起止与位置播报（面包屑的层级
  深度、scope 两栏的边界首当其冲）。
