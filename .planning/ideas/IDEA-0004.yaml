methodology_sources:
  - note: WAI-ARIA Authoring Practices 的 Tree View 模式定义了 role="tree" 隐含的键盘契约（roving tabindex、方向键、Home/End、字母键跳转）
  - note: 「No ARIA is better than bad ARIA」——W3C APG 首条通用规则；声明 role 但不实现其交互模型会让辅助技术进入应用模式后失去可用按键
