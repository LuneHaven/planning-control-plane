id: IDEA-0004
title: 侧栏树声明了 role="tree" 却没有实现 ARIA 键盘模型
status: PROMOTED
detail: |
  2026-09-01 浏览器实测：base.html 的侧栏规划树声明了 role="tree" /
  role="treeitem" / aria-expanded，但配套的键盘交互模型完全没有实现。
  性质上与 IDEA-0003 不同——那条是「做了但不够好」，这条是「承诺了没
  兑现」。

  证据（demo-project 构建产物，页内求值）：
  1. 7 个 treeitem 无一带 tabindex，tree 容器本身也没有。ARIA tree 要求
     roving tabindex：恰好一个 treeitem 为 0，其余为 -1。
  2. app.js 全文只有一处 keydown（第 414 行，Escape 关闭 off-canvas
     侧栏），没有任何方向键、Home/End 处理。
  3. 可聚焦元素落在 treeitem 内部而非 treeitem 自身；有子节点的项各有
     2 个 Tab 停靠点（折叠按钮 + 链接）。

  后果两层。其一，NVDA/JAWS 遇到 role="tree" 会切换到应用模式，把方向
  键交给页面 JS 处理，而页面不处理，方向键在树内直接失效——这种情况
  下声明 role 比不声明更糟。其二，纯键盘用户穿过侧栏需要约 2N 次 Tab
  （50 个节点接近 90 次）；skip link 兜住了「跳过侧栏」，兜不住「在树
  内导航」。

  两条收口路径：
  A. 补全键盘模型——roving tabindex，上下键在可见项间移动，右键展开/
     进入子项，左键折叠/回父项，Home/End 跳首尾，字母键跳转。还需为
     tree-toggle 按钮补动作语义（当前 aria-label 只有节点 id，读作
     「P1 按钮 已展开」）。
  B. 改为普通嵌套导航列表——去掉 role="tree"/"treeitem"，保留 <nav> +
     嵌套 <ul> + 折叠按钮的 aria-expanded。

  2026-09-01 取向：选 B。

  第一版把 B 记成了「降级」、把 A 记成「更符合项目的无障碍基线」，这个
  框定是错的。ARIA 的 tree 模式是给树形数据控件用的——文件浏览器那类，
  有选中态、多选、拖拽、就地重命名。而这个侧栏树只能做两件事：点链接
  跳页、折叠分支。它在语义上本来就是分层导航，不是 tree widget。

  所以 B 不是省事的妥协，是把语义用对；A 才是给一个导航列表套上它并不
  具备的控件语义，然后被迫补齐一整套没人会用的交互。判据是「语义是否
  匹配」，不是「role 是否够重」——用对语义才符合项目既有的无障碍基线。
  成本低（删属性加一轮回归验证，不是一个键盘状态机）是这个选择的结果，
  不是它的理由。

  实现面（2026-09-01 查清，比「删几个属性」大）：折叠状态的样式与脚本
  钩子目前挂在 ARIA 属性本身上，去掉 role 后这些钩子要换成非 ARIA 的
  （data 属性或类名），否则会留下无 role 却带 aria-expanded 的 <li>，
  仍是无效 ARIA。具体位置——
  - style.css:415 `.tree ul[role="group"]`；
  - style.css:461 `.treeitem[aria-expanded="true"] > ... .tree-caret`（箭头方向）；
  - style.css:465 `.treeitem[aria-expanded="false"] > ul[role="group"]`（折叠隐藏）；
  - app.js:216 `.treeitem[aria-expanded]` 及第 220/230/265 行的读写；
  - base.html:52 <li> 上的 role 与 aria-expanded、第 57 行 <ul role="group">。
  app.js 全程用 .treeitem 类名选择、从不用 [role=] 选择器，所以受影响的
  是 aria-expanded 这个状态钩子，不是 role 本身。折叠按钮上的
  aria-expanded 与 aria-controls 保持不动——那两个属性放在 button 上
  本来就成立。

  仍待确认：去掉 role 后层级关系由嵌套 <ul> 承担，屏幕阅读器的列表
  播报（「列表 3 项，第 2 项」）是否足以表达规划树的父子深度。

  工作量修正：仍远小于 A（一套键盘状态机），但属于跨 3 个文件约 10 处的
  机械改动加一轮回归验证，不是删几个属性。

  优先级说明：按「承诺未兑现」的性质排，本条在 IDEA-0003 之前；按目标
  用户的实际使用频率排（状态 badge 每天都在扫），IDEA-0003 在前。两种
  排序都成立，尚未选定。

  实现进展（2026-09-01，B 方案已落地）：排序问题随执行顺序自然解决——
  0003 按频率排序先行完成，本条随后收口。改动面与预查一致：base.html
  去掉 ul role="tree"（连带其冗余 aria-label，标签由外层 nav 承担）、
  li role="treeitem"、ul role="group"；li 的折叠状态钩子 aria-expanded
  迁到 data-expanded（app.js 全程类名选择，只动状态钩子的读写 4 处；
  折叠 button 上的 aria-expanded / aria-controls 原样保留）；style.css
  3 条选择器同位改写（嵌套参考线选择器改为 `.tree ul`，与上方
  `.tree, .tree ul` 同特异性、靠源码顺序取胜）。测试面：原实现零覆盖
  ——没有任何测试断言过 role="tree"，正是「承诺没人验证」的注脚；新增
  test_sidebar_is_a_plain_nested_list_not_an_aria_tree（逐页断言侧栏无
  tree/group ARIA、aria-expanded 不落在 li 上、aria-controls 目标均在
  页内可解析），并翻转既有断言 3 处。fixture 发现一处此前误记：它不是
  style.css 的全量镜像，而是「phase-1 段 + 后续无关改动的同位编辑」，
  门禁按 marker 切头比对——所以本次轮换只对 3 条规则做同位编辑，不能
  整文件拷贝（会把 idea-layer 段错误变成 phase-1 基线）。浏览器实测
  （Chrome，file:// demo）：控制台零错误；点折叠/刷新恢复/全部展开/
  全部收起/当前页分支强制展开全部照常；语言切换与形状渲染不受影响。
  「仍待确认」项保持开放：结构上层级已由嵌套 ul 承担，但屏幕阅读器
  实听播报是否足以表达父子深度，需要真实 SR 会话验证。
  ── 补充（2026-09-01，实现后验证发现）─────────────────────────

  B 方案落地后复核，发现它的前提有个漏洞：方案把层级表达完全交给嵌套
  <ul>，而 style.css:195 有一条全局重置 `ul, ol { list-style: none }`，
  WebKit 对 list-style 为 none 的列表会移除 list / listitem 语义。也就
  是说，在 Safari + VoiceOver 下，去掉 role="tree" 之后层级不是「由嵌套
  列表承担」，而是没人承担——比原状态更糟。

  这正是本条原先写的「仍待确认：屏幕阅读器的列表播报是否足以表达父子
  深度」，答案是：在 WebKit 上不足，除非显式声明。

  已处理：侧栏的两处 <ul> 补上 role="list"（恢复原生语义，不是引入
  widget role，与 B 方案一致），并加了门禁——把属性删掉会让
  test_sidebar_is_a_plain_nested_list_not_an_aria_tree 失败，验证过。

  同一条重置影响全站所有列表（面包屑 <ol>、scope / decision / ref /
  source / branch / idea 各列表），范围超出本条，另记 [[IDEA-0005]]。

  仍未实测：本机只有 Chromium，Element.computedRole 也不可用，无法直接
  读 accessibility tree。上述 WebKit 行为依据公开记录，不是本仓库实测。

