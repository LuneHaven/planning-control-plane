id: IDEA-0005
title: 全局 list-style 重置使 WebKit 丢掉所有列表的语义
status: OPEN
detail: |
  2026-09-01 在验证 IDEA-0004 的实现时发现，范围超出侧栏树，单独记一条。

  style.css:195 有一条全局重置：

      ul,
      ol {
        list-style: none;
      }

  WebKit 自 2020 年起，对 list-style 为 none 的列表会从 accessibility
  tree 里移除 list / listitem 语义（Safari 团队的有意设计：视觉上不像
  列表的东西不该播报成列表）。这条重置命中项目里的每一个列表，因此在
  Safari + VoiceOver 下，以下列表的「共几项、第几项」全部不再播报：

  - node.html:11 面包屑 <ol>（层级深度正是它要传达的信息）
  - node.html 的 scope-list（本轮要做 / 不做）、decision-list（决策）、
    ref-list（依赖 / 阻塞 / 相关）、source-list（来源文档）
  - index.html 的 ref-list、branch-list
  - ideas.html 的 idea-list、idea-sources

  已处理的部分：侧栏树的两处 <ul> 已补 role="list"，因为 IDEA-0004 的
  B 方案把层级表达完全交给了嵌套列表，那里的语义丢失会直接击穿该方案
  的前提。其余列表本条待办。

  缓解因素（所以定为待办而非缺陷）：上面多数列表旁边已有显式计数
  （<span class="count">2</span> 之类），数量信息有文字冗余；真正没有
  替代表达的是面包屑的层级深度和 scope 两栏的边界。

  可选做法：
  A. 给需要语义的 <ul>/<ol> 逐个补 role="list"。业界标准做法，改动
     机械但要逐个判断哪些列表承载信息、哪些纯装饰（例如 idea-sources
     可能算装饰）。约 20 处。
  B. 收窄全局重置，改为只对确实不需要列表语义的类去 list-style，让其余
     列表保留原生标记再用其他方式隐藏。风险是要重新核对每处的视觉。

  倾向 A：显式、可被门禁锁住（侧栏那两处已加断言），且不动视觉。

  尚未确认：本机只有 Chromium，无法实测 VoiceOver 的实际播报。上述
  WebKit 行为来自公开记录而非本仓库实测，落地前值得在真机 Safari 上
  确认一次，至少确认面包屑与 scope 两栏。
  ── 实现进展（2026-09-01，已完成，选 A）─────────────────────────

  选 A（逐个补 role="list"），436 项测试通过，视觉零变化。

  实施时修正了本条原先的一个判断：原文说「要逐个判断哪些列表承载信息、
  哪些纯装饰，例如 idea-sources 可能算装饰」。逐个看下来，这个项目里
  没有一个装饰性列表——包括 idea-sources，「有几条来源支撑这个想法」
  正是 ideas 页要回答的问题，而且它旁边没有 count 冗余。所以答案是
  全部加，判断环节并不存在，A 的成本比预估低。

  改动 23 处（侧栏两处此前已随 [[IDEA-0004]] 补过）：
  - node.html 15 处：面包屑 <ol>、scope-list ×2、decision-list ×5、
    ref-list ×5、source-list ×2
  - index.html 5 处：ref-list ×3、branch-list ×2
  - ideas.html 3 处：idea-list、idea-sources ×2

  门禁改为全站兜底，而不是逐条断言：
  - test_every_list_declares_its_list_role（index 与各 node 页）
  - test_ideas_page_lists_declare_their_list_role（ideas 页，另一个
    fixture，前者覆盖不到）
  两者都是「页面里每个 <ul>/<ol> 都必须带 role=list」，不列白名单。
  故意做成一刀切：这个缺陷完全不可见——渲染无差别、控制台无告警、其余
  测试全绿，而屏幕阅读器那边列表的起止和序号已经没了。新增列表漏加会
  在这里失败。摘掉一处 scope-list 的属性验证过，7 项测试转红。

  未采纳 B（收窄全局重置）：需要重新核对每处视觉，且未来新增列表仍会
  踩同一个坑，门禁也不好写。

  仍未实测：本机只有 Chromium，Element.computedRole 不可用。WebKit 的
  行为依据公开记录，建议在真机 Safari + VoiceOver 上确认一次，重点是
  面包屑的层级深度与 scope 两栏的边界。

