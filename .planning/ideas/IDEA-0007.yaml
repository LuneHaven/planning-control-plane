methodology_sources:
  - note: Python 3.11 至 3.14 在 Windows 上的 stdout 编码规则：直连控制台
      走 UTF-8（_WindowsConsoleIO），重定向到文件或管道时走
      locale.getpreferredencoding，即 ANSI 代码页
  - note: Win32 保留设备名（CON、PRN、AUX、NUL、COM1-9、LPT1-9）带扩展名
      同样按设备解析，微软文件命名规则明确列出 NUL.txt 一类写法
  - note: Git for Windows 安装默认 core.autocrlf=true；gitattributes 的
      -text 覆盖该设置，两个方向都不做行尾转换
  - note: pytest 的 prepend 导入模式把 conftest 所在目录放进 sys.path，
      仓库根只有在以 python -m pytest 启动时才在 sys.path 上
