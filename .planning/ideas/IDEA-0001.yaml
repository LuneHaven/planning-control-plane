methodology_sources:
  - note: 大型开源项目 README 开篇模式（ripgrep、fzf、uv、HTTPie、bat、
      Tauri、ant-design 中文版）：第一句回答「这是什么」，第二拍给证据，
      补充说明用括号或另起句而不用破折号
