id: IDEA-0001
title: 文档风格基线：类别句开篇、散文禁用破折号、对比句配额
status: OPEN
detail: |
  2026-09-01 的 README 开篇修订确立了几条可复用的写作规则：

  1. 开篇第一段先给「类别句」（X 是一个……的工具），第一句只回答
     「这是什么」；证据（截图、数字）紧随其后，理念后置。
  2. 散文中不使用「——」做修辞转折（英文同理，不用 em-dash）；
     列表里术语与解释的分隔符统一为「：」。
  3. 「不是 A 而是 B」对比句全文保留一两处最有力量即可（如首句
     slogan），其余改写为正面陈述。
  4. 引入句的主语写人与活动（「在聊天会话里讨论长期规划，通常会
     遇到三类问题」），不写抽象元陈述（如「失败方式是可以预知的」）。
  5. 对仗排比是翻译腔高发区：「A 记录 X；B 记录 Y」式平行句改写成
     自然的动词句；同一分工不在相邻两句里重复陈述。
  6. 导语不用暗喻（「一棵继承既往决策的树」→「决策与范围边界沿
     规划树继承」）；「被」字被动改主动句；动词搭配逐项核对
     （「不引用 CDN」成立，「不引用网络请求」不成立）。
  7. 清单里的句子也要主谓完整，不写电报式短语（「浏览器内运行时
     切换」→「在浏览器内即时切换」）；概念用词精确到项（三条轨道的
     「三项状态」，不是「三个状态」）。
  8. 冒号不挂同位语（「看 X：一个虚构的示例仓库」→拆成独立句）；
     量词配对名词（一棵树、一个仓库）；「可立即 pcp build」这类
     「可 + 命令名」补成动词短语。
  9. 介词补全（「在每个仓库执行一次」，不是「每个仓库执行一次」）；
     「若要 X，则 Y」改「如果 X，就 Y」；名词化尾缀改动词
     （「作为桥接」→「来桥接」）；同一动词不在近处重复
     （「随仓库分发 / 不随 Python 包安装」）。
  10. 推论句不重复中心词（「一条规则…由此得出两条规则」→「具体到
      工具行为」）；先理清施受关系再选语态（「错误…跳过该文件」→
      「错误时，只记…并跳过该文件」）；「显式的、有意的查询」这类
      形容词串改动作句（「想看 X，要显式执行 Y」）。
  11. 先写最直白的对照句，再看是否还需要术语（用户示范：「规划节点
      是已经规划的任务节点，想法层用于记录尚未规划的初步构思」——
      已规划/尚未规划的对照本身就是全部信息）；「本质上」「落地」
      「准入机制」「管控机制」这类词出现即是语域回退信号，触发重写。
  12. 概念定义不绑定使用场景（「当前焦点是下一个会话应该推进的节
      点」→「当前焦点表示当前最应该推进的节点」）：规划概念先于任
      何一次会话成立，定义不挂在某种用法上。
  13. 术语分层固定，不互换：规划状态（目标、决策、范围、进度、当前
      焦点）持久化为规划数据（YAML 文件）；Dashboard 展示规划数据，
      上下文胶囊从规划数据恢复。「继承」只用于树形语义（决策沿树继
      承），会话背景用「延续」（「上下文无法稳定延续」）。
  14. 收口句式：绝对化收尾删去（「除此之外不含任何其他内容」省写，
      「只携带恢复当前工作所需的内容」已含边界）；远指代就地补明
      （「正因为存在这条边界」→「正因为界面语言不会改变规划数据」）；
      空间比喻改过程句（「越往树下推进」→「规划越往下细化」，
      「从原地继续」→「从中断处继续」）。
  15. CLI 表格只写「命令 → 一句话用途」，复杂行为（回滚语义、参数
      组合、保留注释等）交给 SKILL.md 与 CLI help；单元格塞进四五个
      分句是信息堆积的回归信号。
  16. 产品术语写法固定：首次「Dashboard（仪表盘）」，之后 Dashboard；
      首次「Context Capsule（上下文胶囊）」，之后上下文胶囊；Current
      Focus 写「当前焦点（Current Focus）」；AI 工具统称 AI coding
      harness，不与 agent 混称，会话实例称「AI 会话」。
  17. 处所语义选虚词：状态用「留在」（对应英文 in），位移终点用
      「写进 / 存进」（对应 into）；「留到」只接时间（「留到明天
      再说」），接处所时读者需按时间词预期再回读成趋向补语，且
      自带「搁置延后」义，与「立刻持久化」的主张相反。

  第 1-11 条已应用于 README.zh-CN.md 与 README.md（2026-09-01 第一轮，
  两份同步修订）；第 12-14 条来自同日第二轮中文收口，第 15-16 条来自
  第三轮（CLI 信息密度与术语写法），均仅应用于 README.zh-CN.md，
  README.md 尚待按新版结构整体同步。第 17 条来自同日 tagline 措辞
  推敲（留到→留在），已应用于 README.zh-CN.md 首句；英文 tagline
  本用 in，无需改动。
  后续新增文档（规范、教程、示例 README）可按同一基线写作；若要固化，
  可考虑沉淀为 docs 下的风格说明或并入 AGENTS.md 的仓库规则段。
