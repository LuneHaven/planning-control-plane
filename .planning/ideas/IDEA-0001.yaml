id: IDEA-0001
title: 文档风格基线：类别句开篇、散文禁用破折号、对比句配额
status: OPEN
detail: |
  2026-09-01 的 README 开篇修订确立了几条可复用的写作规则：

  1. 开篇第一段先给「类别句」（X 是一个……的工具），第一句只回答
     「这是什么」；证据（截图、数字）紧随其后，理念后置。
  2. 散文中不使用「——」做修辞转折（英文同理，不用 em-dash）；
     列表里术语与解释的分隔符统一为「：」。
  3. 「不是 A 而是 B」对比句全文保留一两处最有力量即可（如首句
     slogan），其余改写为正面陈述。
  4. 引入句的主语写人与活动（「在聊天会话里讨论长期规划，通常会
     遇到三类问题」），不写抽象元陈述（如「失败方式是可以预知的」）。
  5. 对仗排比是翻译腔高发区：「A 记录 X；B 记录 Y」式平行句改写成
     自然的动词句；同一分工不在相邻两句里重复陈述。
  6. 导语不用暗喻（「一棵继承既往决策的树」→「决策与范围边界沿
     规划树继承」）；「被」字被动改主动句；动词搭配逐项核对
     （「不引用 CDN」成立，「不引用网络请求」不成立）。
  7. 清单里的句子也要主谓完整，不写电报式短语（「浏览器内运行时
     切换」→「在浏览器内即时切换」）；概念用词精确到项（三条轨道的
     「三项状态」，不是「三个状态」）。
  8. 冒号不挂同位语（「看 X：一个虚构的示例仓库」→拆成独立句）；
     量词配对名词（一棵树、一个仓库）；「可立即 pcp build」这类
     「可 + 命令名」补成动词短语。

  已应用于 README.zh-CN.md 与 README.md（2026-09-01，两份同步修订）。
  后续新增文档（规范、教程、示例 README）可按同一基线写作；若要固化，
  可考虑沉淀为 docs 下的风格说明或并入 AGENTS.md 的仓库规则段。
