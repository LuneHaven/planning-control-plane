[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-control-plane"
version = "0.1.0"
description = "Repository-native planning context and progress control tool (pcp)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PCP Contributors" }]
keywords = ["planning", "roadmap", "decision-tracking", "context-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Planning",
]
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pcp = "planning_control_plane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planning_control_plane = ["templates/*.html", "templates/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
